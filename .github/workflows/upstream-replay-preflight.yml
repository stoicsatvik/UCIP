name: UCIP read-only upstream replay preflight
on:
  push:
    branches:
      - research/ucip-replay-preflight-20261110
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch rewritten upstream main
        run: |
          git remote add upstream https://github.com/AnayDhawan/UCIP.git
          git fetch --no-tags --prune upstream main
      - name: Run read-only replay preflight
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/upstream-replay-preflight.txt"
          before="$(git status --porcelain --untracked-files=all)"
          bash research/field_validation/upstream_replay_preflight.sh upstream/main HEAD | tee "$output"
          after="$(git status --porcelain --untracked-files=all)"
          test "$before" = "$after"
      - name: Test candidate path classifier
        run: python -m unittest discover -s tests -p 'test_ucip_replay_classification.py' -v
      - name: Classify non-equivalent candidates by changed paths only
        run: |
          python -m research.field_validation.classify_upstream_replay_candidates \
            upstream/main HEAD > "$RUNNER_TEMP/upstream-replay-candidates.json"
      - name: Preserve read-only preflight and classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucip-read-only-upstream-preflight
          path: |
            ${{ runner.temp }}/upstream-replay-preflight.txt
            ${{ runner.temp }}/upstream-replay-candidates.json
          if-no-files-found: ignore
          retention-days: 14
